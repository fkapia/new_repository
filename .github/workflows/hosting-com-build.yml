name: Build Hosting.com package

on:
  workflow_dispatch:
  push:
    branches:
      - v0/kamoa-signature-photo

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone application
        run: pnpm build:hosting

      - name: Create deployment archive
        run: cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/hosting-com-deploy.zip" .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: hosting-com-deploy
          path: hosting-com-deploy.zip
          if-no-files-found: error
          retention-days: 7
